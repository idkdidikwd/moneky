name: Build Grand Line Quake Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          base64 -d .bundle/slim.b64 > grandline-slim.zip
          echo "7fd9cf2ce0e01ccfcdb0a15a86333ac0722c0caf8781c055c82d2ed9d2ce3714  grandline-slim.zip" | sha256sum -c -
          unzip -q grandline-slim.zip -d work
          test -f work/build.gradle
          test -f work/src/main/resources/fabric.mod.json

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install media tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow

      - name: Generate original sound assets
        working-directory: work
        run: python tools/generate_sounds.py

      - name: Static release audit
        working-directory: work
        run: python tools/verify_release.py

      - name: Clean Fabric build
        working-directory: work
        run: gradle --no-daemon --stacktrace clean build

      - name: Collect distributable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t jars < <(find work/build/libs -maxdepth 1 -type f -name 'grandline-quake-azure-*.jar' ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one distributable jar, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          cp "${jars[0]}" release/grandline-quake-azure-1.0.0-mc26.3-fabric.jar
          sha256sum release/*.jar | tee release/SHA256SUMS.txt
          unzip -p release/*.jar fabric.mod.json | tee release/fabric.mod.json
          grep -q '"minecraft".*"=26.3"' release/fabric.mod.json || grep -q '"minecraft"[[:space:]]*:[[:space:]]*"=26.3"' release/fabric.mod.json
          grep -q '0.19.5' release/fabric.mod.json

      - name: Dedicated server smoke test
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 90s gradle --no-daemon runServer --args='nogui' > ../release/server-smoke.log 2>&1
          code=$?
          set -e
          cat ../release/server-smoke.log
          if grep -Eqi 'MixinApplyError|MixinTransformerError|NoClassDefFoundError|ClassNotFoundException|Could not execute entrypoint|Failed to start the minecraft server|Exception in thread "main"' ../release/server-smoke.log; then
            exit 1
          fi
          if ! grep -Eqi 'Done \([0-9.]+s\)!|For help, type "help"|Starting Minecraft server version' ../release/server-smoke.log; then
            echo "Server startup marker was not observed."
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: grandline-quake-azure-mc26.3-fabric
          path: |
            release/grandline-quake-azure-1.0.0-mc26.3-fabric.jar
            release/SHA256SUMS.txt
            release/fabric.mod.json
            release/server-smoke.log
          if-no-files-found: error
