name: Fabric 26.3 Release Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Expand source project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q grandline-src.zip -d project
          python - <<'PY'
          from pathlib import Path
          root=Path("project")
          for p in list((root/"src/main/java").rglob("*.java"))+list((root/"src/client/java").rglob("*.java")):
              s=p.read_text()
              s=s.replace(".serverLevel()", ".level()").replace(".getTags()", ".entityTags()")
              p.write_text(s)
          p=root/"src/main/java/dev/openai/grandline/ability/GuraAbilities.java"
          s=p.read_text().replace("6.6f+s*.35","(float)(6.6+s*.35)").replace("4.2f+s*.42","(float)(4.2+s*.42)")
          s=s.replace("        flat=flat.normalize();\n        Vec3 right=WorldOps.right(flat);\n",
                      "        flat=flat.normalize();\n        final Vec3 quakeAxis=flat;\n        final Vec3 right=WorldOps.right(quakeAxis);\n")
          s=s.replace("DisplayFx.pressureRing(p,pt,flat,", "DisplayFx.pressureRing(p,pt,quakeAxis,")
          s=s.replace("Vec3 dir=flat.scale(Math.cos(spread))", "Vec3 dir=quakeAxis.scale(Math.cos(spread))")
          s=s.replace("center.add(flat.scale((w-2)*3.4))", "center.add(quakeAxis.scale((w-2)*3.4))")
          s=s.replace("center.add(flat.scale((after-1)*7.0))", "center.add(quakeAxis.scale((after-1)*7.0))")
          p.write_text(s)
          p=root/"src/main/java/dev/openai/grandline/ability/SeiryuAbilities.java"
          p.write_text(p.read_text().replace("2.8f+ring*.75","(float)(2.8+ring*.75)"))
          p=root/"src/main/java/dev/openai/grandline/world/DragonController.java"
          p.write_text(p.read_text().replace("player.hurtMarked=true;","player.needsSync=true;"))
          p=root/"src/main/java/dev/openai/grandline/world/WorldOps.java"
          p.write_text(p.read_text().replace("player.hurtMarked = true;","player.needsSync = true;"))
          p=root/"src/main/java/dev/openai/grandline/world/CommandUtil.java"
          p.write_text(p.read_text().replace(
              "player.getServer().getCommands().performPrefixedCommand(\n                    player.createCommandSourceStack().withPermission(4), command);",
              "player.level().getServer().getCommands().performPrefixedCommand(\n                    player.createCommandSourceStack().withPermission(net.minecraft.server.permissions.PermissionSet.ALL_PERMISSIONS), command);"
          ))
          p=root/"src/main/java/dev/openai/grandline/state/PowerState.java"
          p.write_text(p.read_text().replace(
              "            return copyOnDeath ? configured.copyOnDeath() : configured;\n",
              "            if (copyOnDeath) configured.copyOnDeath();\n"
          ))
          p=root/"src/main/java/dev/openai/grandline/visual/FractureFx.java"
          p.write_text(p.read_text().replace(
              "        Vec3 right = new Vec3(-f.z, 0, f.x);\n        if (right.lengthSqr() < 0.001) right = new Vec3(1, 0, 0);\n        right = right.normalize();\n        Vec3 up = right.cross(f).normalize();\n",
              "        Vec3 rightCandidate = new Vec3(-f.z, 0, f.x);\n        if (rightCandidate.lengthSqr() < 0.001) rightCandidate = new Vec3(1, 0, 0);\n        final Vec3 right = rightCandidate.normalize();\n        final Vec3 up = right.cross(f).normalize();\n"
          ))
          p=root/"src/client/java/dev/openai/grandline/client/ModKeyMappings.java"
          p.write_text(p.read_text().replace("InputConstants.Type.KEYSYM", "InputConstants.Type.KEYBOARD"))
          p=root/"tools/verify_release.py"
          p.write_text(p.read_text().replace('"InputConstants.Type.KEYSYM"', '"InputConstants.Type.KEYBOARD"'))
          PY
          mkdir -p project/.github/workflows
          cp .github/workflows/release-build.yml project/.github/workflows/release-build.yml
          test -f project/build.gradle
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Static QA dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Static release audit
        working-directory: project
        run: python tools/verify_release.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - name: Clean compile and remap
        working-directory: project
        run: gradle --no-daemon --stacktrace clean build
      - name: Dedicated-server startup smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=INT --kill-after=20s 120s gradle --no-daemon runServer --args='nogui' > run/server-smoke.log 2>&1
          code=$?
          set -e
          cat run/server-smoke.log
          grep -Fq 'Grand Line: Quake & Azure initialized for Minecraft 26.3 / Fabric Loader 0.19.5' run/server-smoke.log
          grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' run/server-smoke.log
          if grep -Eiq '(Exception in server tick loop|Mixin apply failed|Could not execute entrypoint|Failed to start the minecraft server)' run/server-smoke.log; then exit 1; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && [ "$code" -ne 130 ] && [ "$code" -ne 143 ]; then exit "$code"; fi
      - name: Verify release artifact and checksum
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'grandline-quake-azure-*.jar' ! -name '*-sources.jar' | sort)
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}" | tee build/libs/SHA256SUMS.txt
          unzip -l "${jars[0]}" | tee build/libs/jar-contents.txt
          unzip -p "${jars[0]}" fabric.mod.json | tee build/libs/built-fabric.mod.json
          grep -Fq '"minecraft": "=26.3"' build/libs/built-fabric.mod.json
          grep -Fq '"fabricloader": ">=0.19.5"' build/libs/built-fabric.mod.json
      - uses: actions/upload-artifact@v4
        with:
          name: grandline-quake-azure-mc26.3-fabric
          if-no-files-found: error
          retention-days: 30
          path: |
            project/build/libs/grandline-quake-azure-*.jar
            !project/build/libs/*-sources.jar
            project/build/libs/SHA256SUMS.txt
            project/build/libs/jar-contents.txt
            project/build/libs/built-fabric.mod.json
            project/run/server-smoke.log
