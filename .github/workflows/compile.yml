name: Compile Grand Line

on:
  push:
    branches: [ main ]
    paths:
      - '.ci_src/**'
      - '.github/workflows/compile.yml'
      - 'patches/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat .ci_src/part*.b64 > /tmp/grandline.b64
          base64 -d /tmp/grandline.b64 > /tmp/grandline.zip
          echo "52301b83ea9ec3ef492641b43d63e67bbb9e1e10a6587e0acec1be1c9b68dd7b  /tmp/grandline.zip" | sha256sum -c -
          rm -rf work
          mkdir work
          unzip -q /tmp/grandline.zip -d work
          if [ -d patches ]; then cp -a patches/. work/; fi
          find work -maxdepth 3 -type f | sort | head -100

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build
        working-directory: work
        run: gradle --no-daemon --stacktrace clean build

      - name: List artifacts
        if: always()
        shell: bash
        run: |
          find work/build -maxdepth 4 -type f -print 2>/dev/null || true

      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grandline-compile-jars
          path: work/build/libs/*.jar
          if-no-files-found: error
